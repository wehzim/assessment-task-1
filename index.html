
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Assessment</title>

    <link rel="stylesheet" href="css.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="box">
        <form class="form" onsubmit="return false;">

            <h1 class="form-title">Welcome Back</h1>

            <span class="form-subtitle">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit
            </span>

            <!-- Your existing Google Login button -->
            <button
                type="button"
                class="gsi-material-button"
                onclick="handleGoogleLogin()"
            >
                <div class="gsi-material-button-state"></div>

                <div class="gsi-material-button-content-wrapper">

                    <div class="gsi-material-button-icon">
                        <svg version="1.1"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 48 48"
                            style="display: block;">

                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                    </div>

                    <span class="gsi-material-button-contents">
                        Sign in with Google
                    </span>

                    <span style="display: none;">
                        Sign in with Google
                    </span>

                </div>
            </button>

            <!-- Login status -->
            <div id="login-status" style="margin-top: 20px;"></div>

            <!-- User information after login -->
            <div id="user-info" style="display: none; margin-top: 20px;">
                <img id="user-picture"
                    src=""
                    alt="Profile picture"
                    width="60"
                    style="border-radius: 50%;">

                <h3 id="user-name"></h3>
                <p id="user-email"></p>

                <button type="button" onclick="handleLogout()">
                    Sign Out
                </button>
            </div>

            <div id="sheet-section" style="margin-top: 30px;">
                <h3>Spreadsheet Data</h3>
                <pre id="sheet-data">Waiting for spreadsheet data...</pre>
            </div>

        </form>
    </div>

    <script>
        // Your Google OAuth Client ID
        const CLIENT_ID =
            "481633445884-ialh1mjafh5e1e97t7ecdr6v0rioqu9p.apps.googleusercontent.com";
        const SPREADSHEET_ID = "17H_phNV4LzQ8U_FxVnlxYixwo324hxMEReBbLjfH-SE";

        const SHEET_RANGE = "'Data Template'!A1:Z";

        let accessToken = null;
        let tokenClient = null;

        // Initialise Google OAuth
        function initialiseGoogleLogin() {

            if (!window.google || !google.accounts?.oauth2) {
                return false;
            }

            tokenClient = google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: "openid email profile https://www.googleapis.com/auth/spreadsheets.readonly",

                callback: async (response) => {

                    if (response.error) {
                        document.getElementById("login-status").textContent =
                            "Google login failed. Please try again.";
                        return;
                    }

                    accessToken = response.access_token;

                    await getUserInformation();
                    await getSheetData();
                }

            });

            return true;
        }

        // Trigger Google Login
        function handleGoogleLogin() {

            document.getElementById("login-status").textContent =
                "Connecting to Google...";

            if (!initialiseGoogleLogin()) {
                document.getElementById("login-status").textContent =
                    "Google services are still loading. Please try again.";
                return;
            }

            tokenClient.requestAccessToken();
        }

        // Retrieve Google account information
        async function getUserInformation() {

            try {

                const response = await fetch(
                    "https://www.googleapis.com/oauth2/v3/userinfo",
                    {
                        headers: {
                            Authorization: "Bearer " + accessToken
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to retrieve user information.");
                }

                const user = await response.json();

                document.getElementById("login-status").textContent =
                    "Login successful!";

                document.getElementById("user-info").style.display = "block";

                document.getElementById("user-name").textContent =
                    user.name;

                document.getElementById("user-email").textContent =
                    user.email;

                document.getElementById("user-picture").src =
                    user.picture;

                // Hide login button after successful login
                document.querySelector(".gsi-material-button").style.display =
                    "none";

            } catch (error) {

                console.error(error);

                document.getElementById("login-status").textContent =
                    "Unable to retrieve your Google account information.";
            }
        }

        // Sign out
        function handleLogout() {

            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken);
            }

            accessToken = null;

            document.getElementById("user-info").style.display = "none";

            document.querySelector(".gsi-material-button").style.display =
                "block";

            document.getElementById("login-status").textContent =
                "You have signed out.";
        }

        
        async function getSheetData() {

            const output = document.getElementById("sheet-data");

            output.textContent = "Loading spreadsheet data...";

            try {

                const url =
                    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}`;

                const response = await fetch(url, {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || "Failed to retrieve spreadsheet.");
                }

                const result = await response.json();

                if (!result.values || result.values.length < 2) {
                    output.textContent = "No spreadsheet data found.";
                    return;
                }

                // First row contains column headers
                const headers = result.values[0].map(header =>
                    header.trim().toLowerCase()
                );

                // Convert spreadsheet rows into objects
                const people = result.values.slice(1).map(row => {

                    const person = {};

                    headers.forEach((header, index) => {
                        person[header] = row[index] || "";
                    });

                    return person;

                });

                console.log("Processed People Data:", people);
                
                // Store data for Three.js page
                sessionStorage.setItem(
                    "peopleData",
                    JSON.stringify(people)
                );

                // Redirect to Three.js
                window.location.href = "data-visualization.html";

                // Pass data to Three.js
                window.dispatchEvent(
                    new CustomEvent("peopleDataLoaded", {
                        detail: people
                    })
                );

                output.textContent =
                    `Successfully loaded ${people.length} records!`;

            } catch (error) {

                console.error(error);

                output.textContent = "Error: " + error.message;
            }
        }

    </script>

</body>
</html>
