<!DOCTYPE html>
<html>
	<head>
		<title>Assessment - Three.js CSS3D </title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css3d - periodic table">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
		<style>

			html, body {
				height: 100%;
			}

			body {
				margin: 0;
				overflow: hidden;
				background: #000;
				font-family: Helvetica, sans-serif;
			}

			#info {
				position: absolute;
				width: 100%;
				color: white;
				padding: 5px;
				text-align: center;
				z-index: 1;
			}

			a {
				color: #8ff;
			}

			#menu {
				position: absolute;
				bottom: 20px;
				width: 100%;
				text-align: center;
			}

			.element {
				width: 180px;
				height: 250px;
				position: relative;
				box-sizing: border-box;
				border-radius: 10px;
				border: 1px solid rgba(127, 255, 255, 0.4);
				background-color: rgba(0, 60, 60, 0.9);
				font-family: Helvetica, sans-serif;
				text-align: center;
				cursor: pointer;
				overflow: hidden;
			}

			.element:hover {
				border-color: rgba(127, 255, 255, 0.9);
			}

			.element .number {
				position: absolute;
				top: 10px;
				right: 12px;
				font-size: 11px;
				color: white;
				opacity: 0.7;
			}

			.element .photo {
				position: absolute;
				top: 28px;
				left: 50%;
				transform: translateX(-50%);
				width: 75px;
				height: 75px;
				border-radius: 50%;
				object-fit: cover;
				border: 2px solid rgba(255, 255, 255, 0.7);
			}

			.element .symbol {
				position: absolute;
				top: 115px;
				left: 5px;
				right: 5px;
				font-size: 16px;
				font-weight: bold;
				color: white;
				text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
			}

			.element .details {
				position: absolute;
				bottom: 12px;
				left: 5px;
				right: 5px;
				font-size: 11px;
				line-height: 1.6;
				color: rgba(255, 255, 255, 0.85);
			}

			button {
				color: rgba(127,255,255,0.75);
				background: transparent;
				outline: 1px solid rgba(127,255,255,0.75);
				border: 0px;
				padding: 5px 10px;
				cursor: pointer;
			}

			button:hover {
				background-color: rgba(0,255,255,0.5);
			}

			button:active {
				color: #000000;
				background-color: rgba(0,255,255,0.75);
			}
		</style>
	</head>
	<body>

		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
		<div id="container"></div>
		<div id="menu">
			<button id="table">TABLE</button>
			<button id="sphere">SPHERE</button>
			<button id="helix">HELIX</button>
			<button id="grid">GRID</button>
		</div>

		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
			}
		}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import TWEEN from 'three/addons/libs/tween.module.js';
			import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
			import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

			let camera, scene, renderer;
			let controls;

			const objects = [];

			const targets = {
				table: [],
				sphere: [],
				helix: [],
				grid: []
			};

			
			console.log("THREE.JS MODULE STARTED!");

			const peopleData = sessionStorage.getItem("peopleData");

			console.log("SESSION STORAGE:", peopleData);

			if (!peopleData) {

				console.error("No spreadsheet data received!");

				alert("No data found. Please sign in first.");

				window.location.href = "index.html";

			} else {

				const people = JSON.parse(peopleData);

				console.log("TOTAL PEOPLE:", people.length);
				console.log("FIRST PERSON:", people[0]);

				init(people);
				animate();

			}


			function init(people) {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.z = 6500;

				scene = new THREE.Scene();

				
				// table - Google Sheets people data

				function getNetWorth(value) {

					if (typeof value === "number") return value;

					let str = String(value || "0").toUpperCase().trim();

					let multiplier = 1;

					if (str.includes("K")) multiplier = 1000;
					if (str.includes("M")) multiplier = 1000000;

					return (parseFloat(str.replace(/[^0-9.-]/g, "")) || 0) * multiplier;

				}


				const periodicPositions = [];

				// Period 1
				[1, 18].forEach(group => {
					periodicPositions.push({ column: group - 1, row: 0 });
				});

				// Periods 2 and 3
				const shortPeriods = [
					[1, 2, 13, 14, 15, 16, 17, 18],
					[1, 2, 13, 14, 15, 16, 17, 18]
				];

				shortPeriods.forEach((groups, index) => {
					groups.forEach(group => {
						periodicPositions.push({
							column: group - 1,
							row: index + 1
						});
					});
				});

				// Periods 4 and 5
				for (let row = 3; row <= 4; row++) {
					for (let group = 1; group <= 18; group++) {
						periodicPositions.push({
							column: group - 1,
							row
						});
					}
				}

				// Period 6: Cs, Ba, La
				[1, 2, 3].forEach(group => {
					periodicPositions.push({ column: group - 1, row: 5 });
				});

				// Lanthanides (Ce–Lu)
				for (let group = 4; group <= 18; group++) {
					periodicPositions.push({
						column: group - 1,
						row: 8
					});
				}

				// Period 6: Hf–Rn
				for (let group = 4; group <= 18; group++) {
					periodicPositions.push({
						column: group - 1,
						row: 5
					});
				}

				// Period 7: Fr, Ra, Ac
				[1, 2, 3].forEach(group => {
					periodicPositions.push({ column: group - 1, row: 6 });
				});

				// Actinides (Th–Lr)
				for (let group = 4; group <= 18; group++) {
					periodicPositions.push({
						column: group - 1,
						row: 9
					});
				}

				// Period 7: Rf–Og
				for (let group = 4; group <= 18; group++) {
					periodicPositions.push({
						column: group - 1,
						row: 6
					});
				}

				// Remember how many positions belong to the periodic table
				const periodicTableCount = periodicPositions.length;

				// Extra people go underneath the table
				while (periodicPositions.length < people.length) {
					const extraIndex = periodicPositions.length - periodicTableCount;

					periodicPositions.push({
						column: extraIndex % 18,
						row: 11 + Math.floor(extraIndex / 18)
					});
				}

				for (let i = 0; i < people.length; i++) {

					const person = people[i];

					const name = person.name || "Unknown";
					const age = person.age || "N/A";
					const country = person.country || "N/A";
					const interest = person.interest || "N/A";

					const netWorth = getNetWorth(
						person.net_worth ?? person["net worth"] ?? person.netWorth
					);

					// Determine card colour

					let cardColor;

					if (netWorth < 100000) {
						cardColor = "rgba(255, 60, 60, 0.65)";
					} else if (netWorth <= 200000) {
						cardColor = "rgba(255, 165, 0, 0.65)";
					} else {
						cardColor = "rgba(0, 200, 100, 0.65)";
					}

					// Create card

					const element = document.createElement("div");

					element.className = "element";
					element.style.backgroundColor = cardColor;

					// Number

					const number = document.createElement("div");

					number.className = "number";
					number.textContent = i + 1;

					element.appendChild(number);

					// Profile photo

					const photoImg = document.createElement("img");

					photoImg.className = "photo";
					photoImg.loading = "lazy";
					photoImg.decoding = "async";
					photoImg.width = 75;
					photoImg.height = 75;
					photoImg.src = person.photo || "";
					photoImg.alt = name;

					photoImg.onerror = function () {
						this.style.display = "none";
					};

					element.appendChild(photoImg);

					// Person's name

					const symbol = document.createElement("div");

					symbol.className = "symbol";
					symbol.textContent = name;

					symbol.style.fontSize = "22px";
					symbol.style.padding = "0 5px";

					element.appendChild(symbol);

					// Person's details

					const details = document.createElement("div");

					details.className = "details";

					details.style.fontSize = "11px";
					details.style.lineHeight = "1.5";
					details.style.whiteSpace = "pre-line";

					details.textContent =
						`${age} years old · ${country}\n` +
						`${interest}\n` +
						`NET WORTH\n` +
						`$${netWorth.toLocaleString("en-US")}`;

					element.appendChild(details);

					// Create CSS3D object

					const objectCSS = new CSS3DObject(element);

					objectCSS.position.x = Math.random() * 4000 - 2000;
					objectCSS.position.y = Math.random() * 4000 - 2000;
					objectCSS.position.z = Math.random() * 4000 - 2000;

					scene.add(objectCSS);

					objects.push(objectCSS);

					const object = new THREE.Object3D();
					const position = periodicPositions[i];

					const columnSpacing = 210;
					const rowSpacing = 280;

					object.position.x =
						position.column * columnSpacing -
						(17 * columnSpacing) / 2;

					object.position.y =
						-position.row * rowSpacing + 900;

					targets.table.push(object);
				}


				// sphere

				const vector = new THREE.Vector3();

				for ( let i = 0, l = objects.length; i < l; i ++ ) {

					const phi = Math.acos( - 1 + ( 2 * i ) / l );
					const theta = Math.sqrt( l * Math.PI ) * phi;

					const object = new THREE.Object3D();

					object.position.setFromSphericalCoords( 1450, phi, theta );

					vector.copy( object.position ).multiplyScalar( 2 );

					object.lookAt( vector );

					targets.sphere.push( object );

				}

				// helix

				/* for ( let i = 0, l = objects.length; i < l; i ++ ) {

					const theta = i * 0.175 + Math.PI;
					const y = - ( i * 8 ) + 450;

					const object = new THREE.Object3D();

					object.position.setFromCylindricalCoords( 900, theta, y );

					vector.x = object.position.x * 2;
					vector.y = object.position.y;
					vector.z = object.position.z * 2;

					object.lookAt( vector );

					targets.helix.push( object );

				} */


				// double helix

				const helixRadius = 850;
				const verticalSpacing = 110;
				const cardScale = 0.4;

				const totalPairs = Math.ceil(objects.length / 2);
				const totalHeight = totalPairs * verticalSpacing;

				for (let i = 0; i < objects.length; i++) {

					// Alternate between the two strands
					const strand = i % 2;
					const strandIndex = Math.floor(i / 2);

					// Twist around the central axis
					const theta = strandIndex * 0.22 + (strand * Math.PI);

					// Vertical position
					const y = -(strandIndex * verticalSpacing) + totalHeight / 2;

					const object = new THREE.Object3D();

					object.position.x = helixRadius * Math.cos(theta);
					object.position.y = y;
					object.position.z = helixRadius * Math.sin(theta);

					// Face outward
					const lookAtPosition = new THREE.Vector3(
						object.position.x * 2,
						object.position.y,
						object.position.z * 2
					);

					object.lookAt(lookAtPosition);

					// Make cards smaller in the helix arrangement
					object.scale.setScalar(0.4);

					targets.helix.push(object);
				}


				// grid

				const gridColumns = 5;
				const gridRows = 4;
				const gridLayers = 10;
				const gridLayerSpacing = 500;
				const cardsPerLayer = gridColumns * gridRows;

				for ( let i = 0; i < objects.length; i ++ ) {

					const object = new THREE.Object3D();

					object.position.x = ( ( i % gridColumns ) * 400 ) - 800;
					object.position.y = ( - ( Math.floor( i / gridColumns ) % gridRows ) * 400 ) + 600;
					object.position.z =
						Math.floor( i / cardsPerLayer ) * gridLayerSpacing -
						( ( gridLayers - 1 ) * gridLayerSpacing ) / 2;

					targets.grid.push( object );

				}

				//

				renderer = new CSS3DRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.getElementById( 'container' ).appendChild( renderer.domElement );

				//

				controls = new TrackballControls( camera, renderer.domElement );
				controls.minDistance = 500;
				controls.maxDistance = 6000;
				controls.addEventListener( 'change', render );

				const buttonTable = document.getElementById( 'table' );
				buttonTable.addEventListener( 'click', function () {

					transform( targets.table, 2000 );

				} );

				const buttonSphere = document.getElementById( 'sphere' );
				buttonSphere.addEventListener( 'click', function () {

					transform( targets.sphere, 2000 );

				} );

				const buttonHelix = document.getElementById( 'helix' );
				buttonHelix.addEventListener( 'click', function () {

					transform( targets.helix, 2000 );

				} );

				const buttonGrid = document.getElementById( 'grid' );
				buttonGrid.addEventListener( 'click', function () {

					transform( targets.grid, 2000 );

				} );

				transform( targets.table, 2000 );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function transform( targetArray, duration ) {

				// Adjust camera focus depending on layout
				if (targetArray === targets.table) {
					controls.target.set(0, -700, 0);
				} else {
					controls.target.set(0, 0, 0);
				}

				controls.update();


				TWEEN.removeAll();

				for ( let i = 0; i < objects.length; i ++ ) {

					const object = objects[ i ];
					const target = targetArray[ i ];

					new TWEEN.Tween( object.position )
						.to( { x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();

					new TWEEN.Tween( object.rotation )
						.to( { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();
					
					new TWEEN.Tween(object.scale)
						.to({
							x: target.scale.x,
							y: target.scale.y,
							z: target.scale.z
						}, Math.random() * duration + duration)
						.easing(TWEEN.Easing.Exponential.InOut)
						.start();

				}

				new TWEEN.Tween( this )
					.to( {}, duration * 2 )
					.onUpdate( render )
					.start();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			function animate() {

				requestAnimationFrame( animate );

				TWEEN.update();

				controls.update();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
